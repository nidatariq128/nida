<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgBox" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2c2112"/>
      <stop offset="65%" stop-color="#110d07"/>
      <stop offset="100%" stop-color="#070604"/>
    </radialGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1813"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c251d"/>
      <stop offset="100%" stop-color="#14100b"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E3AC"/>
      <stop offset="50%" stop-color="#D6B16D"/>
      <stop offset="100%" stop-color="#9A7124"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgBox)"/>
  <ellipse cx="200" cy="326" rx="135" ry="20" fill="#000000" opacity="0.68"/>

  <!-- Box Base -->
  <rect x="86" y="176" width="228" height="136" rx="8" fill="url(#boxSide)" stroke="#463720" stroke-width="1.5"/>
  <!-- Box Lid -->
  <rect x="78" y="142" width="244" height="44" rx="7" fill="url(#boxLid)" stroke="url(#goldRibbon)" stroke-width="1.2"/>

  <!-- Vertical Satin Ribbon -->
  <rect x="184" y="142" width="32" height="170" fill="url(#goldRibbon)" opacity="0.92"/>
  <rect x="189" y="142" width="22" height="170" fill="#F5DFA0" opacity="0.25"/>

  <!-- Horizontal Gold Trim Accent -->
  <line x1="78" y1="184" x2="322" y2="184" stroke="url(#goldRibbon)" stroke-width="1.2" opacity="0.7"/>

  <!-- Satin Ribbon Bow Loops -->
  <path d="M200 142 C172 104, 128 106, 134 134 C138 148, 174 146, 200 142 Z" fill="url(#goldRibbon)" stroke="#8A631D" stroke-width="1"/>
  <path d="M200 142 C228 104, 272 106, 266 134 C262 148, 226 146, 200 142 Z" fill="url(#goldRibbon)" stroke="#8A631D" stroke-width="1"/>
  <path d="M194 146 C176 164, 160 184, 152 200 L168 198 C176 184, 188 164, 198 148 Z" fill="url(#goldRibbon)"/>
  <path d="M206 146 C224 164, 240 184, 248 200 L232 198 C224 184, 212 164, 202 148 Z" fill="url(#goldRibbon)"/>
  <circle cx="200" cy="142" r="10" fill="#F4E0A5" stroke="#8A631D" stroke-width="1.2"/>

  <!-- Luxury Gift Tag -->
  <g transform="translate(234, 194) rotate(8)">
    <rect x="0" y="0" width="54" height="34" rx="4" fill="#100d09" stroke="url(#goldRibbon)" stroke-width="1.2"/>
    <circle cx="8" cy="17" r="2.2" fill="url(#goldRibbon)"/>
    <text x="30" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="url(#goldRibbon)">ZN</text>
    <text x="30" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="5" letter-spacing="1.2" fill="#D6B16D">ROYAL BOX</text>
  </g>
</svg>
